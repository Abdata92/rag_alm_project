[project]
name = "rag-alm-project"
version = "0.1.0"
description = "Agent conversationnel RAG sur la documentation financiere ALM"
authors = [
    {name = "Abdata92",email = "fouobe@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-core (>=1.5.4,<2.0.0)",
    "pypdf (>=6.15.0,<7.0.0)",
    "sentence-transformers (>=5.7.0,<6.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "faiss-cpu (>=1.15.0,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain (>=1.3.15,<2.0.0)",
    "bert-score (>=0.3.13,<0.4.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "streamlit (>=1.61.1,<2.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
